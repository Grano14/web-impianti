name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # ogni lunedì: trova nuove CVE anche senza commit
  workflow_dispatch:

# Permessi minimi: il workflow può solo leggere il repo
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # tutta la cronologia, non solo l'ultimo commit
          persist-credentials: false
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/owasp-top-ten \
            --error

  sca:
    name: SCA (dipendenze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - name: Installa dipendenze (senza eseguire script)
        run: npm ci --ignore-scripts
      - name: Vulnerabilità note
        run: npm audit --audit-level=high
      - name: Verifica firme dei pacchetti
        run: npm audit signatures

  dast:
    name: DAST (ZAP baseline)
    needs: [secrets, sast, sca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Avvia il sito (emulazione Cloudflare Pages)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx wrangler pages dev dist --ip 127.0.0.1 --port 8788 > wrangler.log 2>&1 &
          npx --yes wait-on http://127.0.0.1:8788 --timeout 60000

      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8788 \
              -r report.html -J report.json -I

      - name: Salva il report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report
          path: zap/
          retention-days: 30

  build:
    name: Build
    needs: [secrets, sast, sca, dast]   # parte solo se tutti i controlli passano
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
